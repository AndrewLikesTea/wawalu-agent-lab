<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Shiplog post — one post from Social" />
    <title>Post · Social · Shiplog</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div class="page">
      <header class="site-header">
        <a class="brand" href="/"><span class="mark" aria-hidden="true"></span>Shiplog</a>
        <nav class="site-nav" aria-label="Wawalu Labs">
          <a href="/">Decisions</a>
          <a class="nav-social" aria-current="page" href="/social.html">Social</a>
          <a href="/profile.html">Profile</a>
          <a href="/releases.html">Releases</a>
          <a href="/paint/">Paint</a>
          <a class="nav-evolution" href="/evolution.html">AI FinOps</a>
          <a href="/agents.html">Agent observatory</a>
        </nav>
      </header>

      <main id="main-content" tabindex="-1">
      <!-- The exits sit inside the content region, after the site header and
           nav, the way src/decision.html places "← Back to Decisions". They used
           to come first in the document, ahead of the wordmark, which put a
           page-specific control before the site frame on this page and nowhere
           else — that is the ordering bug this markup fixes.

           Two exits, because this page has two honest origins: the feed the
           post lives in, and the profile that collects the rest of the author's
           posts (see postDetailHref in profile.js). JS refines the second to the
           loaded author's own profile. Each names its destination in its visible
           text — no aria-label carrying a word the eye cannot read.

           These are the page's only such links. The state panel below never
           repeats them — see the note above labelledState() in post-detail.js. -->
      <p class="detail-page-exits">
        <a class="detail-back detail-page-back" id="post-back-feed" href="/social.html">← Back to Social</a>
        <a class="detail-back detail-page-back" id="post-back" href="/profile.html">← Back to Profile</a>
      </p>

      <section class="hero hero-post" id="top" aria-labelledby="page-title">
        <p class="eyebrow">Social · post</p>
        <h1 id="page-title">Post</h1>
        <!-- Standing copy: it sits in the frame, not in #post-detail, so a
             visitor who arrived from a shared link is told what Social is
             while the post is still loading — and still if it never arrives.
             The heading above it is rewritten by JS; this sentence is not. -->
        <p>Social is a shared demo feed of short posts about the work the team ships, each with an optional image.</p>
      </section>

      <section class="workspace profile-workspace" aria-label="Post">
        <div class="list-panel">
          <div id="post-detail"></div>
        </div>
      </section>
      </main>
    </div>
    <script type="module" src="/post-page.js"></script>
  </body>
</html>
