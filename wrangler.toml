name = "wawalu-agent-lab"
pages_build_output_dir = "dist"
compatibility_date = "2026-07-13"

# No [images] block: `wrangler pages deploy` fails configuration validation with
# `Configuration file for Pages projects does not support "images"`, so declaring
# the Images binding here made every production deploy exit 1 while CI stayed
# green -- main kept merging and the live site kept serving the last good build.
# The IMAGES binding is optional in src/bindings.js (/api/image/export returns 503
# without it), so it stays dashboard-configured until Pages supports it in config.

# The posts and social-post APIs require this binding; `/healthz` fails closed
# without it, which is what kept every production smoke test red. Declared here
# rather than only in the dashboard so the binding a commit expects travels with
# the commit, matching the binding contract in src/bindings.js.
[[d1_databases]]
binding = "DB"
database_name = "wawalu-agent-lab"
database_id = "1370a4c4-e74b-4f2d-aaff-7fb4d4a31841"
migrations_dir = "migrations"
